<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astra Sendagaya Shino 3D VRM Pet Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent !important;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@2.1.2/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

    const container = document.getElementById('canvas-container');

    // 1. High Performance Transparent WebGL Renderer (0% CPU when idle, smooth 60 FPS)
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
    renderer.setClearColor(0x000000, 0); // Complete alpha transparency
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // 2. Camera & Scene (Zero head-clipping framing, generous headroom above hair)
    const camera = new THREE.PerspectiveCamera(32.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 0.72, 3.40);
    camera.lookAt(0.0, 0.72, 0.0);

    const scene = new THREE.Scene();

    window.renderer = renderer;
    window.scene = scene;
    window.camera = camera;

    // 3. Studio Anime Lighting
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.45);
    keyLight.position.set(1.0, 2.2, 2.0).normalize();
    scene.add(keyLight);

    const ambientLight = new THREE.AmbientLight(0xfff5f5, 1.05);
    scene.add(ambientLight);

    const fillLight = new THREE.DirectionalLight(0xf472b6, 0.55);
    fillLight.position.set(-1.5, 1.2, -1.0).normalize();
    scene.add(fillLight);

    let currentVRM = null;
    let mixer = null;
    const actions = {};
    const cachedVRMAs = {};
    let currentAction = null;
    let currentState = 'idle';
    let currentDanceIndex = 0;
    let isTalking = false;
    let talkTimer = 0;
    let targetRotationY = Math.PI;

    // Realistic Biological Speeds (Natural Tempo)
    const speedMap = {
      idle: 0.85,        // Calming, deep natural breath (~14 bpm)
      walk: 0.50,        // Calm gentle human walking cadence
      picked_up: 0.85,   // Soft floating air dangle
      falling: 0.90,     // Free fall suspension
      hurt: 0.80,        // Dazed recovery
      sit: 0.75,         // Gentle sitting
      wave: 0.95,        // Cheerful hand wave
      celebrate: 0.90,   // Joyful jump
      talk: 0.85,        // Expressive conversational gestures
      dance_1: 0.88,     // Smooth pop groove
      dance_2: 0.88,     // Stylish anime groove
      hiphop: 0.88,      // Clean hip hop tempo
      twist_dance: 0.85, // Rhythm twist
      silly_dance: 0.85  // Cute anime dance
    };

    // Selected In-Place Dance Choreographies that stay centered
    const danceNames = [
      'dance_1',
      'dance_2',
      'hiphop',
      'twist_dance',
      'silly_dance',
      'celebrate'
    ];

    const animConfig = {
      idle: 'animations/idle_loop.vrma',
      walk: 'animations/running.vrma',
      picked_up: 'animations/hanging.vrma',
      falling: 'animations/hanging.vrma',
      hurt: 'animations/lay.vrma',
      sit: 'animations/sit.vrma',
      wave: 'animations/wave_fast.vrma',
      celebrate: 'animations/joyful_jump.vrma',
      talk: 'animations/talking.vrma',
      dance_1: 'animations/dance_1.vrma',
      dance_2: 'animations/dance_2.vrma',
      hiphop: 'animations/hiphop.vrma',
      twist_dance: 'animations/twist_dance.vrma',
      silly_dance: 'animations/silly_dance.vrma'
    };

    // Smooth Look-at Tracking
    const lookAtTarget = new THREE.Object3D();
    lookAtTarget.position.set(0, 1.35, 10.0);
    scene.add(lookAtTarget);

    const desiredLookAt = new THREE.Vector3(0, 1.35, 10.0);
    let lastMouseMoveTime = Date.now();

    // 4. VRM & Animation Loader
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

    /**
     * Sanitizes and normalizes animation tracks to ensure the character
     * stays strictly in-place at natural standing/sitting height and NEVER
     * drifts off-screen or falls below the floor.
     */
    function sanitizeClip(clip, vrm, animKey) {
      const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
      const restY = hips ? hips.position.y : 0.893;

      clip.tracks.forEach(track => {
        if (track.name.endsWith('.position')) {
          const vals = track.values;
          const count = vals.length / 3;
          if (count === 0) return;

          let sumX = 0, sumY = 0, sumZ = 0;
          for (let i = 0; i < count; i++) {
            sumX += vals[i * 3];
            sumY += vals[i * 3 + 1];
            sumZ += vals[i * 3 + 2];
          }
          const avgX = sumX / count;
          const avgY = sumY / count;
          const avgZ = sumZ / count;

          const isSit = animKey === 'sit';
          const isHurt = animKey === 'hurt';
          let targetY = restY;
          if (isSit) targetY = restY * 0.62;
          if (isHurt) targetY = restY * 0.32;

          for (let i = 0; i < count; i++) {
            // Center X horizontally with damped natural sway (±0.15m max)
            vals[i * 3 + 0] = (vals[i * 3 + 0] - avgX) * 0.45;
            // Center Y at natural hips height, preserving vertical bounce
            const newY = targetY + (vals[i * 3 + 1] - avgY);
            vals[i * 3 + 1] = Math.max(0.28, Math.min(1.4, newY));
            // Center Z depth
            vals[i * 3 + 2] = (vals[i * 3 + 2] - avgZ) * 0.35;
          }
        }
      });
      return clip;
    }

    // -------------------------------------------------------------
    // Real 3D Rock Drum Kit & Drumsticks
    // -------------------------------------------------------------
    const rubyMat = new THREE.MeshStandardMaterial({
      color: 0xbe123c,
      roughness: 0.28,
      metalness: 0.35
    });
    const chromeMat = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.12,
      metalness: 0.95
    });
    const headMat = new THREE.MeshStandardMaterial({
      color: 0xf8fafc,
      roughness: 0.65,
      metalness: 0.05
    });
    const cymbalMat = new THREE.MeshStandardMaterial({
      color: 0xf59e0b,
      roughness: 0.20,
      metalness: 0.85
    });
    const seatMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      roughness: 0.5,
      metalness: 0.1
    });

    function makeDrum(radius, depth, isHorizontal = false) {
      const drumGroup = new THREE.Group();
      const shell = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, 24, 1, true), rubyMat);
      drumGroup.add(shell);

      const headGeo = new THREE.CircleGeometry(radius * 0.98, 24);
      const topHead = new THREE.Mesh(headGeo, headMat);
      topHead.rotation.x = -Math.PI / 2;
      topHead.position.y = depth / 2;
      drumGroup.add(topHead);

      const btmHead = new THREE.Mesh(headGeo, headMat);
      btmHead.rotation.x = Math.PI / 2;
      btmHead.position.y = -depth / 2;
      drumGroup.add(btmHead);

      const rimGeo = new THREE.TorusGeometry(radius, 0.007, 6, 24);
      const topRim = new THREE.Mesh(rimGeo, chromeMat);
      topRim.rotation.x = Math.PI / 2;
      topRim.position.y = depth / 2;
      drumGroup.add(topRim);

      const btmRim = new THREE.Mesh(rimGeo, chromeMat);
      btmRim.rotation.x = Math.PI / 2;
      btmRim.position.y = -depth / 2;
      drumGroup.add(btmRim);

      if (isHorizontal) {
        drumGroup.rotation.x = Math.PI / 2;
      }
      return drumGroup;
    }

    function makeStand(x, z, height) {
      const stand = new THREE.Group();
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, height, 10), chromeMat);
      post.position.set(x, height / 2, z);
      stand.add(post);

      for (let a = 0; a < 3; a++) {
        const angle = a * (Math.PI * 2 / 3);
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.16, 6), chromeMat);
        leg.position.set(x + Math.sin(angle) * 0.07, 0.05, z + Math.cos(angle) * 0.07);
        leg.rotation.z = Math.sin(angle) * 0.50;
        leg.rotation.x = Math.cos(angle) * 0.50;
        stand.add(leg);
      }
      return stand;
    }

    function createDrumKit() {
      const group = new THREE.Group();
      group.name = 'drumKitGroup';

      // 1. Throne (Drum stool)
      const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.05, 20), seatMat);
      seat.position.set(0.0, 0.38, -0.06);
      group.add(seat);
      group.add(makeStand(0.0, -0.06, 0.36));

      // 2. Bass Drum (Kick)
      const kick = makeDrum(0.19, 0.20, true);
      kick.position.set(0.05, 0.19, 0.28);
      group.add(kick);

      // Kick legs
      const kickLegL = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.20, 6), chromeMat);
      kickLegL.position.set(-0.13, 0.09, 0.33);
      kickLegL.rotation.z = 0.55;
      group.add(kickLegL);
      const kickLegR = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.20, 6), chromeMat);
      kickLegR.position.set(0.23, 0.09, 0.33);
      kickLegR.rotation.z = -0.55;
      group.add(kickLegR);

      // 3. Snare Drum
      const snare = makeDrum(0.11, 0.08);
      snare.position.set(-0.11, 0.44, 0.16);
      snare.rotation.z = 0.10;
      group.add(snare);
      group.add(makeStand(-0.11, 0.16, 0.40));

      // 4. Rack Tom
      const rackTom = makeDrum(0.08, 0.07);
      rackTom.position.set(0.02, 0.49, 0.26);
      rackTom.rotation.x = -0.22;
      group.add(rackTom);

      // 5. Floor Tom
      const floorTom = makeDrum(0.12, 0.12);
      floorTom.position.set(0.23, 0.38, 0.15);
      group.add(floorTom);
      group.add(makeStand(0.23, 0.15, 0.32));

      // 6. Hi-Hat
      const hihatGroup = new THREE.Group();
      hihatGroup.position.set(-0.24, 0.56, 0.16);
      const cymGeo = new THREE.ConeGeometry(0.12, 0.015, 20, 1, true);
      const topCym = new THREE.Mesh(cymGeo, cymbalMat);
      topCym.rotation.x = Math.PI;
      const btmCym = new THREE.Mesh(cymGeo, cymbalMat);
      btmCym.position.y = -0.012;
      hihatGroup.add(topCym);
      hihatGroup.add(btmCym);
      group.add(hihatGroup);
      group.add(makeStand(-0.24, 0.16, 0.56));

      // 7. Crash Cymbal
      const crashGroup = new THREE.Group();
      crashGroup.position.set(0.26, 0.68, 0.18);
      const crashCym = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.018, 24, 1, true), cymbalMat);
      crashCym.rotation.x = Math.PI;
      crashGroup.add(crashCym);
      group.add(crashGroup);
      group.add(makeStand(0.26, 0.18, 0.68));

      group.visible = false;
      return { group, crashGroup, snare, kick, hihatGroup };
    }

    const drumKit = createDrumKit();
    scene.add(drumKit.group);

    // Drumsticks
    const stickGeo = new THREE.CylinderGeometry(0.005, 0.006, 0.28, 8);
    const stickMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.35 });
    const leftStick = new THREE.Mesh(stickGeo, stickMat);
    leftStick.name = 'leftDrumstick';
    leftStick.rotation.x = Math.PI / 2;
    leftStick.position.set(0, 0, 0.12);
    leftStick.visible = false;

    const rightStick = new THREE.Mesh(stickGeo, stickMat);
    rightStick.name = 'rightDrumstick';
    rightStick.rotation.x = Math.PI / 2;
    rightStick.position.set(0, 0, 0.12);
    rightStick.visible = false;

    function attachDrumsticks(vrm) {
      if (!vrm?.humanoid) return;
      const lHand = vrm.humanoid.getNormalizedBoneNode('leftHand');
      const rHand = vrm.humanoid.getNormalizedBoneNode('rightHand');
      if (lHand && !lHand.getObjectByName('leftDrumstick')) {
        lHand.add(leftStick);
      }
      if (rHand && !rHand.getObjectByName('rightDrumstick')) {
        rHand.add(rightStick);
      }
    }

    let isDrumming = false;
    let drumCrashWobble = 0.0;

    function applyDrummingKinematics(vrm, time) {
      if (!vrm?.humanoid) return;
      const bones = vrm.humanoid;
      const hips = bones.getNormalizedBoneNode('hips');
      const spine = bones.getNormalizedBoneNode('spine');
      const chest = bones.getNormalizedBoneNode('chest');
      const head = bones.getNormalizedBoneNode('head');
      const lUThigh = bones.getNormalizedBoneNode('leftUpperLeg');
      const rUThigh = bones.getNormalizedBoneNode('rightUpperLeg');
      const lCalf = bones.getNormalizedBoneNode('leftLowerLeg');
      const rCalf = bones.getNormalizedBoneNode('rightLowerLeg');
      const lFoot = bones.getNormalizedBoneNode('leftFoot');
      const rFoot = bones.getNormalizedBoneNode('rightFoot');
      const lUArm = bones.getNormalizedBoneNode('leftUpperArm');
      const rUArm = bones.getNormalizedBoneNode('rightUpperArm');
      const lForearm = bones.getNormalizedBoneNode('leftLowerArm');
      const rForearm = bones.getNormalizedBoneNode('rightLowerArm');
      const lHand = bones.getNormalizedBoneNode('leftHand');
      const rHand = bones.getNormalizedBoneNode('rightHand');

      // Seated pose on drum throne
      if (hips) {
        hips.position.set(0.0, 0.44, -0.06);
        hips.rotation.set(0.05, Math.PI, 0.0);
      }
      if (lUThigh) lUThigh.rotation.set(-1.42, 0.24, 0.0);
      if (rUThigh) rUThigh.rotation.set(-1.42, -0.24, 0.0);
      if (lCalf) lCalf.rotation.set(1.48, 0.0, 0.0);
      if (rCalf) rCalf.rotation.set(1.48, 0.0, 0.0);

      // Drum tempo: 125 BPM
      const bpm = 125.0;
      const beat = (time * (bpm / 60.0) * Math.PI);
      const bar = (time * (bpm / 60.0) / 4.0) % 4.0;

      // 1. Headbang & Torso Groove
      const headBang = Math.sin(beat * 2.0);
      if (head) {
        head.rotation.set(0.18 + headBang * 0.16, Math.sin(beat * 0.5) * 0.06, 0.0);
      }
      if (spine) spine.rotation.set(-0.06 + headBang * 0.04, 0.0, Math.sin(beat) * 0.03);
      if (chest) chest.rotation.set(-0.08, 0.0, Math.sin(beat) * 0.04);

      // 2. Feet (Kick on 1 & 3, Hi-hat pedal on 2 & 4)
      const kickTap = Math.max(0, Math.sin(beat * 2.0));
      if (rFoot) rFoot.rotation.set(0.24 - kickTap * 0.22, 0.0, 0.0);
      if (lFoot) lFoot.rotation.set(0.24 - Math.max(0, -Math.sin(beat * 2.0)) * 0.16, 0.0, 0.0);

      // 3. Left Hand (Snare Backbeat on 2 & 4)
      const snareStrike = Math.pow(Math.max(0, -Math.sin(beat)), 5);
      if (lUArm) lUArm.rotation.set(0.48 - snareStrike * 0.35, 0.36, -0.22);
      if (lForearm) lForearm.rotation.set(-1.08 - snareStrike * 0.45, 0.20, 0.08);
      if (lHand) lHand.rotation.set(-0.15 - snareStrike * 0.55, 0.0, 0.0);

      // 4. Right Hand (8th note Hi-Hat pulse & occasional Crash Cymbal smash)
      const isCrashBar = bar < 0.40;
      if (isCrashBar) {
        const crashStrike = Math.pow(Math.max(0, Math.sin(bar * Math.PI * 2.5)), 4);
        if (rUArm) rUArm.rotation.set(0.72 - crashStrike * 0.30, -0.52, 0.42);
        if (rForearm) rForearm.rotation.set(-0.95 - crashStrike * 0.38, -0.30, 0.0);
        if (rHand) rHand.rotation.set(-0.20 - crashStrike * 0.60, 0.0, 0.0);
        drumCrashWobble = 0.25;
      } else {
        const hihatStrike = Math.pow(Math.max(0, Math.sin(beat * 4.0)), 4);
        if (rUArm) rUArm.rotation.set(0.42 - hihatStrike * 0.25, -0.38, 0.18);
        if (rForearm) rForearm.rotation.set(-1.05 - hihatStrike * 0.32, -0.20, -0.08);
        if (rHand) rHand.rotation.set(-0.12 - hihatStrike * 0.48, 0.0, 0.0);
      }

      // 5. Crash Cymbal wobble physics
      if (drumCrashWobble > 0.001) {
        drumCrashWobble *= 0.94;
        drumKit.crashGroup.rotation.z = Math.sin(time * 30.0) * drumCrashWobble;
      } else {
        drumKit.crashGroup.rotation.z = 0;
      }
    }

    async function init() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const initialModel = urlParams.get('model') || 'Sendagaya_Shino.vrm';
        console.log('[AstraVRM] Loading 3D Avatar:', initialModel);
        const gltf = await loader.loadAsync(initialModel);
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);
        currentVRM = vrm;
        window.currentVRM = vrm;
        attachDrumsticks(vrm);

        // Face forward towards camera
        vrm.scene.rotation.y = Math.PI;

        // Setup lookAt target
        if (vrm.lookAt) {
          vrm.lookAt.target = lookAtTarget;
        }

        // Animation Mixer
        mixer = new THREE.AnimationMixer(vrm.scene);
        window.mixer = mixer;
        window.actions = actions;

        // Preload key animations asynchronously
        console.log('[AstraVRM] Preloading natural humanoid animations...');
        for (const [key, path] of Object.entries(animConfig)) {
          try {
            const animGltf = await loader.loadAsync(path);
            const vrma = animGltf.userData.vrmAnimations?.[0];
            if (vrma) {
              cachedVRMAs[key] = vrma;
              const rawClip = createVRMAnimationClip(vrma, vrm);
              const sanitizedClip = sanitizeClip(rawClip, vrm, key);
              const action = mixer.clipAction(sanitizedClip);
              if (key === 'hurt' || key === 'wave' || key === 'celebrate') {
                action.setLoop(THREE.LoopOnce);
                action.clampWhenFinished = true;
              } else {
                action.setLoop(THREE.LoopRepeat);
              }
              const naturalSpeed = speedMap[key] || 0.90;
              action.timeScale = naturalSpeed;
              action.setEffectiveTimeScale(naturalSpeed);
              actions[key] = action;
            }
          } catch (e) {
            console.warn('[AstraVRM] Could not load anim:', key, e);
          }
        }

        console.log('[AstraVRM] Loaded actions:', Object.keys(actions));

        // Start in gentle idle
        playAction('idle', 0.25);

        window.isPetReady = true;
      } catch (err) {
        console.error('[AstraVRM] Initialization error:', err);
      }
    }

    window.switchVRMModel = async function(modelFileName) {
      try {
        console.log('[AstraVRM] Switching model to:', modelFileName);
        if (!modelFileName) return;
        if (currentVRM) {
          scene.remove(currentVRM.scene);
          VRMUtils.deepDispose(currentVRM.scene);
          currentVRM = null;
        }
        const gltf = await loader.loadAsync(modelFileName);
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);
        currentVRM = vrm;
        window.currentVRM = vrm;
        attachDrumsticks(vrm);

        vrm.scene.rotation.y = targetRotationY;
        if (vrm.lookAt) {
          vrm.lookAt.target = lookAtTarget;
        }

        mixer = new THREE.AnimationMixer(vrm.scene);
        window.mixer = mixer;

        for (const k in actions) delete actions[k];

        for (const [key, vrma] of Object.entries(cachedVRMAs)) {
          try {
            const rawClip = createVRMAnimationClip(vrma, vrm);
            const sanitizedClip = sanitizeClip(rawClip, vrm, key);
            const action = mixer.clipAction(sanitizedClip);
            if (key === 'hurt' || key === 'wave' || key === 'celebrate') {
              action.setLoop(THREE.LoopOnce);
              action.clampWhenFinished = true;
            } else {
              action.setLoop(THREE.LoopRepeat);
            }
            const naturalSpeed = speedMap[key] || 0.90;
            action.timeScale = naturalSpeed;
            action.setEffectiveTimeScale(naturalSpeed);
            actions[key] = action;
          } catch (e) {
            console.warn('Error binding anim:', key, e);
          }
        }
        currentAction = null;
        playAction(currentState || 'idle', 0.2);
        console.log('[AstraVRM] Switched to model successfully:', modelFileName);
      } catch (err) {
        console.error('[AstraVRM] Model switch error:', err);
      }
    };

    function playAction(name, fadeDuration = 0.32) {
      if (!mixer) return;
      const nextAction = actions[name];
      if (!nextAction) {
        console.warn('[AstraVRM] Action not found:', name);
        return;
      }

      if (currentAction === nextAction && nextAction.isRunning()) {
        return;
      }

      nextAction.reset();
      const naturalSpeed = speedMap[name] || 0.90;
      nextAction.timeScale = naturalSpeed;
      nextAction.setEffectiveTimeScale(naturalSpeed);
      nextAction.setEffectiveWeight(1.0);

      if (currentAction) {
        currentAction.crossFadeTo(nextAction, fadeDuration, true);
      }
      nextAction.play();
      currentAction = nextAction;
    }

    init();

    // 5. Global API exposed to Python PyQt6
    window.setPetState = (state, facingDirection) => {
      currentState = state || 'idle';
      if (!currentVRM?.expressionManager) return;

      // Soft reset expressions
      ['happy', 'relaxed', 'surprised', 'sad', 'angry'].forEach(e => {
        currentVRM.expressionManager.setValue(e, 0);
      });

      // Update Facing Angle smoothly
      if (facingDirection !== undefined) {
        if (facingDirection < 0) {
          targetRotationY = Math.PI - 0.35; // turned slightly left
        } else if (facingDirection > 0) {
          targetRotationY = Math.PI + 0.35; // turned slightly right
        } else {
          targetRotationY = Math.PI;
        }
      } else {
        targetRotationY = Math.PI;
      }

      if (currentState === 'dance' || currentState === 'drums') {
        isDrumming = true;
        drumKit.group.visible = true;
        leftStick.visible = true;
        rightStick.visible = true;
        currentVRM.expressionManager?.setValue('happy', 0.95);
        currentVRM.expressionManager?.setValue('relaxed', 0.2);
        if (currentAction) {
          currentAction.stop();
          currentAction = null;
        }
      } else {
        if (isDrumming) {
          isDrumming = false;
          drumKit.group.visible = false;
          leftStick.visible = false;
          rightStick.visible = false;
          const hips = currentVRM.humanoid?.getNormalizedBoneNode('hips');
          if (hips) hips.position.set(0.0, 0.893, 0.0);
        }
        if (currentState === 'picked_up' || currentState === 'falling') {
          currentVRM.expressionManager?.setValue('surprised', 1.0);
          playAction('picked_up', 0.2);
        } else if (currentState === 'hurt') {
          currentVRM.expressionManager?.setValue('sad', 0.9);
          currentVRM.expressionManager?.setValue('blink', 0.8);
          playAction('hurt', 0.15);
        } else if (currentState === 'sit') {
          currentVRM.expressionManager?.setValue('relaxed', 1.0);
          playAction('sit', 0.4);
        } else if (currentState === 'walk') {
          currentVRM.expressionManager?.setValue('relaxed', 0.3);
          playAction('walk', 0.25);
        } else if (currentState === 'wave') {
          currentVRM.expressionManager?.setValue('happy', 1.0);
          playAction('wave', 0.25);
        } else if (currentState === 'celebrate') {
          currentVRM.expressionManager?.setValue('happy', 1.0);
          playAction('celebrate', 0.25);
        } else {
          // Idle: pleasant gentle warmth
          currentVRM.expressionManager?.setValue('relaxed', 0.35);
          currentVRM.expressionManager?.setValue('happy', 0.15);
          playAction('idle', 0.35);
        }
      }
    };

    window.setFacing = (facing) => {
      if (facing < 0) targetRotationY = Math.PI - 0.35;
      else if (facing > 0) targetRotationY = Math.PI + 0.35;
      else targetRotationY = Math.PI;
    };

    window.setTalking = (talking) => {
      isTalking = Boolean(talking);
      if (isTalking) {
        if (actions['talk'] && (currentState === 'idle' || currentState === 'sit')) {
          playAction('talk', 0.25);
        }
      } else {
        if (currentVRM?.expressionManager) {
          currentVRM.expressionManager.setValue('aa', 0);
          currentVRM.expressionManager.setValue('oh', 0);
          currentVRM.expressionManager.setValue('ih', 0);
        }
        if (currentState === 'idle') {
          playAction('idle', 0.3);
        }
      }
    };

    window.setLookAt = (screenNormX, screenNormY) => {
      lastMouseMoveTime = Date.now();
      desiredLookAt.x = screenNormX * 2.2;
      desiredLookAt.y = 1.35 - screenNormY * 1.8;
    };

    window.nextDance = () => {
      currentDanceIndex++;
      const chosen = danceNames[currentDanceIndex % danceNames.length];
      playAction(chosen, 0.35);
      return chosen;
    };

    window.triggerWave = () => {
      window.setPetState('wave');
    };

    window.triggerJump = () => {
      window.setPetState('celebrate');
    };

    // Track mouse over pet window
    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = (e.clientY / window.innerHeight) * 2 - 1;
      window.setLookAt(normX, normY);
    });

    // 6. 3D Render & Natural Animation Loop (Silky 60 FPS)
    const clock = new THREE.Clock();

    // Natural Eye Blinking State Machine
    let blinkTimer = 2.0;
    let isBlinking = false;
    let blinkProgress = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (mixer && !isDrumming) {
        mixer.update(delta);
      }

      if (currentVRM) {
        if (isDrumming) {
          applyDrummingKinematics(currentVRM, time);
        }

        // VRM update handles expressionManager, lookAt, and springBoneManager (hair/hoodie physics)
        currentVRM.update(delta);

        // Hardware safety guard: ensure hips position never drops below ground or drifts
        if (!isDrumming) {
          const hips = currentVRM.humanoid?.getNormalizedBoneNode('hips');
          if (hips) {
            if (hips.position.y < 0.25) {
              hips.position.y = 0.893;
            }
            if (Math.abs(hips.position.x) > 0.45) {
              hips.position.x = Math.sign(hips.position.x) * 0.45;
            }
            if (Math.abs(hips.position.z) > 0.45) {
              hips.position.z = Math.sign(hips.position.z) * 0.45;
            }
          }
        }

        // Smoothly interpolate rotation facing
        currentVRM.scene.rotation.y += (targetRotationY - currentVRM.scene.rotation.y) * 0.12;

        // Ambient glance wanderer when mouse cursor is not moving
        if (Date.now() - lastMouseMoveTime > 2500) {
          const wanderX = Math.sin(time * 0.45) * 0.7;
          const wanderY = 1.35 + Math.cos(time * 0.3) * 0.25;
          desiredLookAt.set(wanderX, wanderY, 10.0);
        }

        // Smoothly interpolate lookAt target
        lookAtTarget.position.lerp(desiredLookAt, 0.08);

        // Natural Human Eye Blinking with micro double-blinks
        if (currentState !== 'hurt' && currentState !== 'dance') {
          blinkTimer -= delta;
          if (blinkTimer <= 0) {
            isBlinking = true;
            blinkProgress = 0;
            // Next blink in 2.5 to 5.5 seconds (occasional quick double blink)
            blinkTimer = (Math.random() < 0.22) ? 0.32 : (2.5 + Math.random() * 3.0);
          }
          if (isBlinking) {
            blinkProgress += delta * 12.0; // quick 150ms natural eyelid closure
            if (blinkProgress < Math.PI) {
              const val = Math.sin(blinkProgress);
              currentVRM.expressionManager?.setValue('blink', val);
            } else {
              currentVRM.expressionManager?.setValue('blink', 0.0);
              isBlinking = false;
            }
          }
        }

        // Real-time lip-sync mouth vowels with natural speech modulation
        if (isTalking) {
          talkTimer += delta * 12.0;
          const openA = Math.max(0, Math.sin(talkTimer)) * 0.65;
          const openO = Math.max(0, Math.cos(talkTimer * 0.75)) * 0.45;
          const openI = Math.max(0, Math.sin(talkTimer * 1.3)) * 0.35;
          currentVRM.expressionManager?.setValue('aa', openA);
          currentVRM.expressionManager?.setValue('oh', openO);
          currentVRM.expressionManager?.setValue('ih', openI);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
