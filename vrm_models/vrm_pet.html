<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astra Sendagaya Shino 3D VRM Pet Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent !important;
    }
  </style>

  <script async src="/lib/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "/lib/three.module.js",
        "three/addons/": "/lib/",
        "@pixiv/three-vrm": "/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';
    import { loadMixamoAnimation } from './loadMixamoAnimation.js';

    const container = document.getElementById('canvas-container');

    // 1. High Performance Transparent WebGL Renderer (0% CPU when idle, smooth 60 FPS)
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
    renderer.setClearColor(0x000000, 0); // Complete alpha transparency
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // 2. Camera & Scene (Zero head-clipping framing, generous headroom above hair)
    const camera = new THREE.PerspectiveCamera(32.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 0.72, 3.40);
    camera.lookAt(0.0, 0.72, 0.0);

    const scene = new THREE.Scene();

    window.renderer = renderer;
    window.scene = scene;
    window.camera = camera;
    window.THREE = THREE;

    // 3. Studio Anime Lighting
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.45);
    keyLight.position.set(1.0, 2.2, 2.0).normalize();
    scene.add(keyLight);

    const ambientLight = new THREE.AmbientLight(0xfff5f5, 1.05);
    scene.add(ambientLight);

    const fillLight = new THREE.DirectionalLight(0xf472b6, 0.55);
    fillLight.position.set(-1.5, 1.2, -1.0).normalize();
    scene.add(fillLight);

    let currentVRM = null;
    let mixer = null;
    const actions = {};
    const cachedVRMAs = {};
    let currentAction = null;
    let currentState = 'idle';
    let currentDanceIndex = 0;
    let isTalking = false;
    let talkTimer = 0;
    let targetRotationY = Math.PI;

    
    // 3. Drum Kit Stage Group (Seat + Kit + Sticks)
    const drumStageGroup = new THREE.Group();
    drumStageGroup.name = 'drumStage';
    drumStageGroup.visible = false;
    scene.add(drumStageGroup);

    // Drum Throne (Stool)
    const stoolGroup = new THREE.Group();
    const cushion = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 0.08, 24),
      new THREE.MeshStandardMaterial({ color: 0x1f1f23, roughness: 0.35 })
    );
    cushion.position.y = 0.44;
    stoolGroup.add(cushion);
    const legMat = new THREE.MeshStandardMaterial({ color: 0xd0d5dd, metalness: 0.85, roughness: 0.15 });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.44, 16), legMat);
    stem.position.y = 0.22;
    stoolGroup.add(stem);
    for (let i = 0; i < 3; i++) {
      const angle = (i * 2 * Math.PI) / 3;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.28, 12), legMat);
      leg.position.set(Math.cos(angle) * 0.12, 0.14, Math.sin(angle) * 0.12);
      leg.rotation.z = Math.cos(angle) * 0.35;
      leg.rotation.x = -Math.sin(angle) * 0.35;
      stoolGroup.add(leg);
    }
    stoolGroup.position.set(0, 0, -0.05);
    drumStageGroup.add(stoolGroup);

    // 3D Drum Kit
    const gltfLoader = new GLTFLoader();
    let drumKit = null;
    gltfLoader.load('drum_kit.glb', (gltf) => {
      drumKit = gltf.scene;
      drumKit.scale.set(0.68, 0.68, 0.68);
      drumKit.position.set(0, 0.40, 0.48);
      drumKit.rotation.y = 0;
      drumStageGroup.add(drumKit);
      console.log('[AstraVRM] 3D Drum Kit attached to stage!');
    });

    let stickL = null;
    let stickR = null;

    function createStick(name) {
      const grp = new THREE.Group();
      grp.name = name || 'stick';

      // Authentic 5A Hickory Wood Material (Warm natural wood with delicate lacquer finish)
      const woodMat = new THREE.MeshStandardMaterial({
        color: 0xedd6af,
        roughness: 0.35,
        metalness: 0.05
      });

      // 1. Main Tapered Shaft: 32cm from fulcrum (radius 0.0070) down to neck (radius 0.0048)
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.0048, 0.0070, 0.32, 16),
        woodMat
      );
      shaft.position.y = 0.16; // spans 0 to +0.32
      grp.add(shaft);

      // 2. Acorn Tip: realistic tear-drop wooden striking bead
      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.0062, 16, 16),
        woodMat
      );
      tip.position.y = 0.325;
      tip.scale.set(1.0, 1.4, 1.0);
      grp.add(tip);

      // 3. Butt Shaft: 7cm extending below the fulcrum / hand
      const buttShaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.0070, 0.0072, 0.07, 16),
        woodMat
      );
      buttShaft.position.y = -0.035; // spans 0 to -0.07
      grp.add(buttShaft);

      // 4. Rounded Butt Cap
      const buttCap = new THREE.Mesh(
        new THREE.SphereGeometry(0.0071, 14, 14),
        woodMat
      );
      buttCap.position.y = -0.07;
      grp.add(buttCap);

      // 5. Classic manufacturer brand stripe on stick body
      const brandBand = new THREE.Mesh(
        new THREE.CylinderGeometry(0.00705, 0.00705, 0.012, 16),
        new THREE.MeshBasicMaterial({ color: 0x242424 })
      );
      brandBand.position.y = 0.025;
      grp.add(brandBand);

      return grp;
    }

    function attachDrumsticks(vrm) {
      if (stickL && stickL.parent) stickL.parent.remove(stickL);
      if (stickR && stickR.parent) stickR.parent.remove(stickR);

      // Attach directly to Hand bones (wrist/palm rigid frame) for authentic matched grip
      const leftHand = vrm.humanoid?.getNormalizedBoneNode('leftHand');
      const rightHand = vrm.humanoid?.getNormalizedBoneNode('rightHand');
      const isDrumVisible = (currentState === 'dance' || currentState === 'drums' || currentState === 'drumming');

      if (leftHand) {
        stickL = createStick('stickL');
        // Anatomical grip inside the left fist:
        stickL.position.set(-0.065, -0.012, -0.015);
        // Calibrated matched grip pointing down-forward into snare drum
        const lTarget = new THREE.Vector3(-0.935, 0.236, 0.266).normalize();
        stickL.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), lTarget);
        stickL.visible = isDrumVisible;
        leftHand.add(stickL);
      }

      if (rightHand) {
        stickR = createStick('stickR');
        // Anatomical grip inside the right fist:
        stickR.position.set(0.065, -0.012, -0.015);
        // Calibrated matched grip pointing up-forward ready to strike cymbal
        const rTarget = new THREE.Vector3(-0.034, 0.999, 0.021).normalize();
        stickR.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), rTarget);
        stickR.visible = isDrumVisible;
        rightHand.add(stickR);
      }
    }

    async function loadDrummingAnimation(vrm) {
      try {
        console.log('[AstraVRM] Loading Mixamo Drumming mocap...');
        const clip = await loadMixamoAnimation('animations/Playing_Drums.fbx', vrm);
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat);
        action.timeScale = 1.0;
        actions['drumming'] = action;
        console.log('[AstraVRM] Drumming animation ready!');
      } catch (err) {
        console.warn('[AstraVRM] Failed to load drumming mocap:', err);
      }
    }

    // Realistic Biological Speeds (Natural Tempo)
    const speedMap = {
      idle: 0.85,        // Calming, deep natural breath (~14 bpm)
      walk: 0.50,        // Calm gentle human walking cadence
      picked_up: 0.85,   // Soft floating air dangle
      falling: 0.90,     // Free fall suspension
      hurt: 0.80,        // Dazed recovery
      sit: 0.75,         // Gentle sitting
      wave: 0.95,        // Cheerful hand wave
      celebrate: 0.90,   // Joyful jump
      talk: 0.85,        // Expressive conversational gestures
      drumming: 1.0,        // Authentic Rock Drumming
      dance_1: 0.88,     // Smooth pop groove
      dance_2: 0.88,     // Stylish anime groove
      hiphop: 0.88,      // Clean hip hop tempo
      twist_dance: 0.85, // Rhythm twist
      silly_dance: 0.85  // Cute anime dance
    };

    // Selected In-Place Dance Choreographies that stay centered
    const danceNames = [
      'dance_1',
      'dance_2',
      'hiphop',
      'twist_dance',
      'silly_dance',
      'celebrate'
    ];

    const animConfig = {
      idle: 'animations/idle_loop.vrma',
      walk: 'animations/running.vrma',
      picked_up: 'animations/hanging.vrma',
      falling: 'animations/hanging.vrma',
      hurt: 'animations/lay.vrma',
      sit: 'animations/sit.vrma',
      wave: 'animations/wave_fast.vrma',
      celebrate: 'animations/joyful_jump.vrma',
      talk: 'animations/talking.vrma',
      dance_1: 'animations/dance_1.vrma',
      dance_2: 'animations/dance_2.vrma',
      hiphop: 'animations/hiphop.vrma',
      twist_dance: 'animations/twist_dance.vrma',
      silly_dance: 'animations/silly_dance.vrma'
    };

    // Smooth Look-at Tracking
    const lookAtTarget = new THREE.Object3D();
    lookAtTarget.position.set(0, 1.35, 10.0);
    scene.add(lookAtTarget);

    const desiredLookAt = new THREE.Vector3(0, 1.35, 10.0);
    let lastMouseMoveTime = Date.now();

    // 4. VRM & Animation Loader
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

    /**
     * Sanitizes and normalizes animation tracks to ensure the character
     * stays strictly in-place at natural standing/sitting height and NEVER
     * drifts off-screen or falls below the floor.
     */
    function sanitizeClip(clip, vrm, animKey) {
      const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
      const restY = hips ? hips.position.y : 0.893;

      clip.tracks.forEach(track => {
        if (track.name.endsWith('.position')) {
          const vals = track.values;
          const count = vals.length / 3;
          if (count === 0) return;

          let sumX = 0, sumY = 0, sumZ = 0;
          for (let i = 0; i < count; i++) {
            sumX += vals[i * 3];
            sumY += vals[i * 3 + 1];
            sumZ += vals[i * 3 + 2];
          }
          const avgX = sumX / count;
          const avgY = sumY / count;
          const avgZ = sumZ / count;

          const isSit = animKey === 'sit';
          const isHurt = animKey === 'hurt';
          let targetY = restY;
          if (isSit) targetY = restY * 0.62;
          if (isHurt) targetY = restY * 0.32;

          for (let i = 0; i < count; i++) {
            // Center X horizontally with damped natural sway (±0.15m max)
            vals[i * 3 + 0] = (vals[i * 3 + 0] - avgX) * 0.45;
            // Center Y at natural hips height, preserving vertical bounce
            const newY = targetY + (vals[i * 3 + 1] - avgY);
            vals[i * 3 + 1] = Math.max(0.28, Math.min(1.4, newY));
            // Center Z depth
            vals[i * 3 + 2] = (vals[i * 3 + 2] - avgZ) * 0.35;
          }
        }
      });
      return clip;
    }

    async function init() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const initialModel = urlParams.get('model') || 'Sendagaya_Shino.vrm';
        console.log('[AstraVRM] Loading 3D Avatar:', initialModel);
        const gltf = await loader.loadAsync(initialModel);
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);
        currentVRM = vrm;
        window.currentVRM = vrm;

        // Face forward towards camera
        vrm.scene.rotation.y = Math.PI;
        attachDrumsticks(vrm);

        // Setup lookAt target
        if (vrm.lookAt) {
          vrm.lookAt.target = lookAtTarget;
        }

        // Animation Mixer
        mixer = new THREE.AnimationMixer(vrm.scene);
        window.mixer = mixer;
        attachDrumsticks(vrm);
        window.actions = actions;
        // Priority 1: Load Idle and Rock Drumming mocap immediately for instant responsiveness
        try {
          const idleGltf = await loader.loadAsync(animConfig.idle);
          const vrma = idleGltf.userData.vrmAnimations?.[0];
          if (vrma) {
            cachedVRMAs['idle'] = vrma;
            const rawClip = createVRMAnimationClip(vrma, vrm);
            const sanitizedClip = sanitizeClip(rawClip, vrm, 'idle');
            const action = mixer.clipAction(sanitizedClip);
            action.setLoop(THREE.LoopRepeat);
            action.timeScale = speedMap.idle || 0.85;
            actions['idle'] = action;
          }
        } catch (e) {
          console.warn('[AstraVRM] Could not load idle anim:', e);
        }

        await loadDrummingAnimation(vrm);
        console.log('[AstraVRM] Core actions loaded:', Object.keys(actions));

        // Start in gentle idle immediately!
        playAction('idle', 0.25);
        window.isPetReady = true;

        // Priority 2: Preload secondary animations in background non-blocking
        (async () => {
          for (const [key, path] of Object.entries(animConfig)) {
            if (key === 'idle') continue;
            try {
              const animGltf = await loader.loadAsync(path);
              const vrma = animGltf.userData.vrmAnimations?.[0];
              if (vrma) {
                cachedVRMAs[key] = vrma;
                const rawClip = createVRMAnimationClip(vrma, vrm);
                const sanitizedClip = sanitizeClip(rawClip, vrm, key);
                const action = mixer.clipAction(sanitizedClip);
                if (key === 'hurt' || key === 'wave' || key === 'celebrate') {
                  action.setLoop(THREE.LoopOnce);
                  action.clampWhenFinished = true;
                } else {
                  action.setLoop(THREE.LoopRepeat);
                }
                const naturalSpeed = speedMap[key] || 0.90;
                action.timeScale = naturalSpeed;
                actions[key] = action;
              }
            } catch (e) {
              console.warn('[AstraVRM] Could not load anim:', key, e);
            }
          }
          console.log('[AstraVRM] All background actions ready:', Object.keys(actions));
        })();
        window.isPetReady = true;
      } catch (err) {
        console.error('[AstraVRM] Initialization error:', err);
      }
    }

    window.switchVRMModel = async function(modelFileName) {
      try {
        console.log('[AstraVRM] Switching model to:', modelFileName);
        if (!modelFileName) return;
        if (currentVRM) {
          scene.remove(currentVRM.scene);
          VRMUtils.deepDispose(currentVRM.scene);
          currentVRM = null;
        }
        const gltf = await loader.loadAsync(modelFileName);
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);
        currentVRM = vrm;
        window.currentVRM = vrm;

        vrm.scene.rotation.y = targetRotationY;
        if (vrm.lookAt) {
          vrm.lookAt.target = lookAtTarget;
        }

        mixer = new THREE.AnimationMixer(vrm.scene);
        window.mixer = mixer;

        for (const k in actions) delete actions[k];

        for (const [key, vrma] of Object.entries(cachedVRMAs)) {
          try {
            const rawClip = createVRMAnimationClip(vrma, vrm);
            const sanitizedClip = sanitizeClip(rawClip, vrm, key);
            const action = mixer.clipAction(sanitizedClip);
            if (key === 'hurt' || key === 'wave' || key === 'celebrate') {
              action.setLoop(THREE.LoopOnce);
              action.clampWhenFinished = true;
            } else {
              action.setLoop(THREE.LoopRepeat);
            }
            const naturalSpeed = speedMap[key] || 0.90;
            action.timeScale = naturalSpeed;
            action.setEffectiveTimeScale(naturalSpeed);
            actions[key] = action;
          } catch (e) {
            console.warn('Error binding anim:', key, e);
          }
        }
        attachDrumsticks(vrm);
        await loadDrummingAnimation(vrm);
        currentAction = null;
        window.setPetState(currentState || 'idle');
        console.log('[AstraVRM] Switched to model successfully:', modelFileName);
      } catch (err) {
        console.error('[AstraVRM] Model switch error:', err);
      }
    };

    function playAction(name, fadeDuration = 0.32) {
      if (!mixer) return;
      const nextAction = actions[name];
      if (!nextAction) {
        console.warn('[AstraVRM] Action not found:', name);
        return;
      }

      if (currentAction === nextAction && nextAction.isRunning()) {
        return;
      }

      const isDrum = (name === 'drumming' || ((currentState === 'dance' || currentState === 'drums' || currentState === 'drumming') && name === 'dance_2'));
      drumStageGroup.visible = isDrum;
      if (stickL) stickL.visible = isDrum;
      if (stickR) stickR.visible = isDrum;

      nextAction.reset();
      const naturalSpeed = speedMap[name] || 0.90;
      nextAction.timeScale = naturalSpeed;
      nextAction.setEffectiveTimeScale(naturalSpeed);
      nextAction.setEffectiveWeight(1.0);

      if (currentAction) {
        currentAction.crossFadeTo(nextAction, fadeDuration, true);
      }
      nextAction.play();
      currentAction = nextAction;
    }

    init();

    // 5. Global API exposed to Python PyQt6
    window.setPetState = (state, facingDirection) => {
      currentState = state || 'idle';
      if (!currentVRM?.expressionManager) return;

      // Soft reset expressions
      ['happy', 'relaxed', 'surprised', 'sad', 'angry'].forEach(e => {
        currentVRM.expressionManager.setValue(e, 0);
      });

      // Update Facing Angle smoothly
      if (facingDirection !== undefined) {
        if (facingDirection < 0) {
          targetRotationY = Math.PI - 0.35; // turned slightly left
        } else if (facingDirection > 0) {
          targetRotationY = Math.PI + 0.35; // turned slightly right
        } else {
          targetRotationY = Math.PI;
        }
      } else {
        targetRotationY = Math.PI;
      }

      const isDrumming = (currentState === 'dance' || currentState === 'drums' || currentState === 'drumming');
      if (!isDrumming) {
        drumStageGroup.visible = false;
        if (stickL) stickL.visible = false;
        if (stickR) stickR.visible = false;
      }

      if (isDrumming) {
        currentVRM.expressionManager?.setValue('happy', 0.95);
        currentVRM.expressionManager?.setValue('relaxed', 0.2);
        targetRotationY = Math.PI; // Face directly forward behind the drum kit
        if (actions['drumming']) {
          playAction('drumming', 0.35);
        } else {
          playAction('dance_2', 0.35);
        }
      } else if (currentState === 'picked_up' || currentState === 'falling') {
          currentVRM.expressionManager?.setValue('surprised', 1.0);
          playAction('picked_up', 0.2);
        } else if (currentState === 'hurt') {
          currentVRM.expressionManager?.setValue('sad', 0.9);
          currentVRM.expressionManager?.setValue('blink', 0.8);
          playAction('hurt', 0.15);
        } else if (currentState === 'sit') {
          currentVRM.expressionManager?.setValue('relaxed', 1.0);
          playAction('sit', 0.4);
        } else if (currentState === 'walk') {
          currentVRM.expressionManager?.setValue('relaxed', 0.3);
          playAction('walk', 0.25);
        } else if (currentState === 'wave') {
          currentVRM.expressionManager?.setValue('happy', 1.0);
          playAction('wave', 0.25);
        } else if (currentState === 'celebrate') {
          currentVRM.expressionManager?.setValue('happy', 1.0);
          playAction('celebrate', 0.25);
        } else {
          // Idle: pleasant gentle warmth
          currentVRM.expressionManager?.setValue('relaxed', 0.35);
          currentVRM.expressionManager?.setValue('happy', 0.15);
          playAction('idle', 0.35);
        }
    };

    window.setFacing = (facing) => {
      if (facing < 0) targetRotationY = Math.PI - 0.35;
      else if (facing > 0) targetRotationY = Math.PI + 0.35;
      else targetRotationY = Math.PI;
    };

    window.setTalking = (talking) => {
      isTalking = Boolean(talking);
      if (isTalking) {
        if (actions['talk'] && (currentState === 'idle' || currentState === 'sit')) {
          playAction('talk', 0.25);
        }
      } else {
        if (currentVRM?.expressionManager) {
          currentVRM.expressionManager.setValue('aa', 0);
          currentVRM.expressionManager.setValue('oh', 0);
          currentVRM.expressionManager.setValue('ih', 0);
        }
        if (currentState === 'idle') {
          playAction('idle', 0.3);
        }
      }
    };

    window.setLookAt = (screenNormX, screenNormY) => {
      lastMouseMoveTime = Date.now();
      desiredLookAt.x = screenNormX * 2.2;
      desiredLookAt.y = 1.35 - screenNormY * 1.8;
    };

    window.nextDance = () => {
      currentDanceIndex++;
      const chosen = danceNames[currentDanceIndex % danceNames.length];
      playAction(chosen, 0.35);
      return chosen;
    };
    window.cycleDance = window.nextDance;

    window.triggerWave = () => {
      window.setPetState('wave');
    };

    window.triggerJump = () => {
      window.setPetState('celebrate');
    };

    // Track mouse over pet window
    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = (e.clientY / window.innerHeight) * 2 - 1;
      window.setLookAt(normX, normY);
    });

    // 6. 3D Render & Natural Animation Loop (Silky 60 FPS)
    const clock = new THREE.Clock();

    // Natural Eye Blinking State Machine
    let blinkTimer = 2.0;
    let isBlinking = false;
    let blinkProgress = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (mixer) {
        mixer.update(delta);
      }

      if (currentVRM) {
        // VRM update handles expressionManager, lookAt, and springBoneManager (hair/hoodie physics)
        currentVRM.update(delta);

        // Hardware safety guard: ensure hips position never drops below ground or drifts
        const hips = currentVRM.humanoid?.getNormalizedBoneNode('hips');
          if (hips) {
            if (hips.position.y < 0.25) {
              hips.position.y = 0.893;
            }
            if (Math.abs(hips.position.x) > 0.45) {
              hips.position.x = Math.sign(hips.position.x) * 0.45;
            }
            if (Math.abs(hips.position.z) > 0.45) {
              hips.position.z = Math.sign(hips.position.z) * 0.45;
            }
          }

        // Smoothly interpolate rotation facing
        currentVRM.scene.rotation.y += (targetRotationY - currentVRM.scene.rotation.y) * 0.12;

        // Ambient glance wanderer when mouse cursor is not moving
        if (Date.now() - lastMouseMoveTime > 2500) {
          const wanderX = Math.sin(time * 0.45) * 0.7;
          const wanderY = 1.35 + Math.cos(time * 0.3) * 0.25;
          desiredLookAt.set(wanderX, wanderY, 10.0);
        }

        // Smoothly interpolate lookAt target
        lookAtTarget.position.lerp(desiredLookAt, 0.08);

        // Natural Human Eye Blinking with micro double-blinks
        if (currentState !== 'hurt' && currentState !== 'dance') {
          blinkTimer -= delta;
          if (blinkTimer <= 0) {
            isBlinking = true;
            blinkProgress = 0;
            // Next blink in 2.5 to 5.5 seconds (occasional quick double blink)
            blinkTimer = (Math.random() < 0.22) ? 0.32 : (2.5 + Math.random() * 3.0);
          }
          if (isBlinking) {
            blinkProgress += delta * 12.0; // quick 150ms natural eyelid closure
            if (blinkProgress < Math.PI) {
              const val = Math.sin(blinkProgress);
              currentVRM.expressionManager?.setValue('blink', val);
            } else {
              currentVRM.expressionManager?.setValue('blink', 0.0);
              isBlinking = false;
            }
          }
        }

        // Real-time lip-sync mouth vowels with natural speech modulation
        if (isTalking) {
          talkTimer += delta * 12.0;
          const openA = Math.max(0, Math.sin(talkTimer)) * 0.65;
          const openO = Math.max(0, Math.cos(talkTimer * 0.75)) * 0.45;
          const openI = Math.max(0, Math.sin(talkTimer * 1.3)) * 0.35;
          currentVRM.expressionManager?.setValue('aa', openA);
          currentVRM.expressionManager?.setValue('oh', openO);
          currentVRM.expressionManager?.setValue('ih', openI);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
