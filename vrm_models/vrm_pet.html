<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astra Sendagaya Shino 3D VRM Pet Lite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent !important;
    }
  </style>

  <script async src="/lib/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "/lib/three.module.js",
        "three/addons/": "/lib/",
        "@pixiv/three-vrm": "/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

    const container = document.getElementById('canvas-container');

    // 1. Lightweight Transparent WebGL Renderer (no preserveDrawingBuffer, pixelRatio 1 for low CPU/GPU)
    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: true,
      preserveDrawingBuffer: false,
      powerPreference: 'default'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // 2. Camera & Scene (Full headroom & full drum kit clearance)
    const camera = new THREE.PerspectiveCamera(33.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    const camStandPos = new THREE.Vector3(0.0, 0.74, 3.45);
    const camStandLook = new THREE.Vector3(0.0, 0.74, 0.0);
    const camDrumPos = new THREE.Vector3(-0.075, 0.78, 4.35);
    const camDrumLook = new THREE.Vector3(-0.075, 0.65, 0.12);

    function updateDrumCameraFraming() {
      // Drum kit spans x in [-0.96, +0.77] (centered at x=-0.075, half-span ~0.92m at z~0.4)
      // Guarantee full cymbals, stands & kick drum clearance inside 86% of viewport width at any aspect!
      const halfSpanNeeded = 0.92;
      const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
      const minZ = 0.40 + halfSpanNeeded / (0.86 * tanHalfFov * Math.max(0.45, camera.aspect));
      camDrumPos.set(-0.075, 0.78, Math.max(4.35, minZ));
      camDrumLook.set(-0.075, 0.65, 0.12);
    }
    updateDrumCameraFraming();

    camera.position.copy(camStandPos);
    camera.lookAt(camStandLook);

    const scene = new THREE.Scene();

    window.renderer = renderer;
    window.scene = scene;
    window.camera = camera;
    window.THREE = THREE;

    // 3. Clean Anime Lighting
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.45);
    keyLight.position.set(1.0, 2.2, 2.0).normalize();
    scene.add(keyLight);

    const ambientLight = new THREE.AmbientLight(0xfff5f5, 1.05);
    scene.add(ambientLight);

    const fillLight = new THREE.DirectionalLight(0xf472b6, 0.50);
    fillLight.position.set(-1.5, 1.2, -1.0).normalize();
    scene.add(fillLight);

    let currentVRM = null;
    let mixer = null;
    const actions = {};
    const cachedVRMAs = {};
    const loadingAnims = {};
    let currentAction = null;
    let currentState = 'idle';
    let currentDanceIndex = 0;
    let isTalking = false;
    let talkTimer = 0;
    let targetRotationY = Math.PI;
    let isDrummingActive = false;

    // 4. Drum Kit Stage Group (Elevated slightly so pedals/bass drum never clip bottom taskbar)
    const drumStageGroup = new THREE.Group();
    drumStageGroup.name = 'drumStage';
    drumStageGroup.visible = false;
    drumStageGroup.position.set(0.0, 0.10, 0.0);
    scene.add(drumStageGroup);

    // Stool (static matrices frozen after build)
    const stoolGroup = new THREE.Group();
    const cushion = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 0.08, 18),
      new THREE.MeshStandardMaterial({ color: 0x1f1f23, roughness: 0.35 })
    );
    cushion.position.y = 0.44;
    stoolGroup.add(cushion);
    const legMat = new THREE.MeshStandardMaterial({ color: 0xd0d5dd, metalness: 0.85, roughness: 0.15 });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.44, 10), legMat);
    stem.position.y = 0.22;
    stoolGroup.add(stem);
    for (let i = 0; i < 3; i++) {
      const angle = (i * 2 * Math.PI) / 3;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.28, 8), legMat);
      leg.position.set(Math.cos(angle) * 0.12, 0.14, Math.sin(angle) * 0.12);
      leg.rotation.z = Math.cos(angle) * 0.35;
      leg.rotation.x = -Math.sin(angle) * 0.35;
      stoolGroup.add(leg);
    }
    stoolGroup.position.set(0, 0, -0.05);
    stoolGroup.traverse(o => { o.updateMatrix(); o.matrixAutoUpdate = false; });
    drumStageGroup.add(stoolGroup);

    // Calibrated 3D Drum Kit (lazy-loaded once or on demand, static matrices frozen!)
    const gltfLoader = new GLTFLoader();
    let drumKit = null;
    let drumKitLoading = false;
    let drumAnimData = null;
    let drumTime = 0;
    let drumDuration = 1.60;

    const drumBoneNames = [
      'chest',
      'leftUpperArm', 'leftLowerArm', 'leftHand',
      'rightUpperArm', 'rightLowerArm', 'rightHand'
    ];

    const seatedLowerBody = {
      hips: { pos: [-0.098, 0.745, -0.020], quat: [0.1379, 0.2028, -0.0737, 0.9667] },
      spine: { quat: [-0.1643, -0.0102, 0.0171, 0.9862] },
      upperChest: { quat: [-0.0775, -0.0035, 0.0076, 0.9970] },
      leftUpperLeg: { quat: [-0.4652, -0.0291, 0.0827, -0.8808] },
      leftLowerLeg: { quat: [-0.6871, 0.0383, -0.0475, 0.7240] },
      leftFoot: { quat: [0.2090, 0.0929, 0.0982, 0.9685] },
      rightUpperLeg: { quat: [0.5189, -0.0648, 0.2310, 0.8205] },
      rightLowerLeg: { quat: [-0.6939, -0.0284, -0.0328, 0.7188] },
      rightFoot: { quat: [0.0299, -0.0020, -0.0567, 0.9979] }
    };

    function ensureDrumAssetsLoaded() {
      if (!drumKit && !drumKitLoading) {
        drumKitLoading = true;
        gltfLoader.load('drum_kit_opt.glb', (gltf) => {
          const rawScene = gltf.scene;
          const dkPos = drumAnimData?.drumKit?.pos || { x: -0.08, y: 0.72, z: 0.64 };
          const dkScale = drumAnimData?.drumKit?.scale || 0.56;

          // High-Performance Mesh Batching: merge 182 static meshes into ~11 unified meshes by material!
          // Reduces WebGL draw calls from 226 down to ~102 (-55% draw calls)!
          rawScene.updateMatrixWorld(true);
          const invRoot = rawScene.matrixWorld.clone().invert();
          const matMap = new Map();

          rawScene.traverse(obj => {
            if (obj.isMesh && obj.visible && (!obj.name || !obj.name.toLowerCase().includes('plane'))) {
              const mat = obj.material;
              if (!matMap.has(mat)) matMap.set(mat, []);
              const g = obj.geometry.clone();
              const relMat = new THREE.Matrix4().multiplyMatrices(invRoot, obj.matrixWorld);
              g.applyMatrix4(relMat);
              matMap.get(mat).push(g);
            }
          });

          drumKit = new THREE.Group();
          drumKit.name = 'drumKit';
          for (const [mat, geoms] of matMap.entries()) {
            if (geoms.length === 1) {
              const m = new THREE.Mesh(geoms[0], mat);
              m.matrixAutoUpdate = false;
              drumKit.add(m);
            } else {
              const mergedGeo = mergeGeometries(geoms, false);
              if (mergedGeo) {
                const m = new THREE.Mesh(mergedGeo, mat);
                m.matrixAutoUpdate = false;
                drumKit.add(m);
              }
            }
          }

          drumKit.position.set(dkPos.x, dkPos.y, dkPos.z);
          drumKit.rotation.y = THREE.MathUtils.degToRad(drumAnimData?.drumKit?.rotY || 0);
          drumKit.scale.setScalar(dkScale);
          drumKit.matrixAutoUpdate = false;
          drumKit.updateMatrix();

          drumStageGroup.add(drumKit);
          console.log('[AstraVRM] High-performance batched Drum Kit ready! Meshes merged to', drumKit.children.length);
        });
      }
      if (!drumAnimData) {
        fetch('astra_drum_animation.json')
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data) {
              drumAnimData = data;
              drumDuration = data.duration || 1.60;
              if (drumKit && data.drumKit) {
                drumKit.position.set(data.drumKit.pos.x, data.drumKit.pos.y, data.drumKit.pos.z);
                drumKit.scale.setScalar(data.drumKit.scale || 0.56);
                drumKit.updateMatrix();
              }
              console.log('[AstraVRM] Calibrated drum tracks loaded:', drumDuration + 's');
            }
          })
          .catch(() => {});
      }
    }

    // Load lightweight 15KB drum JSON on startup; load 5MB GLB lazily or smoothly
    fetch('astra_drum_animation.json')
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data) {
          drumAnimData = data;
          drumDuration = data.duration || 1.60;
        }
      }).catch(() => {});

    let stickL = null;
    let stickR = null;

    function createStick(name) {
      const grp = new THREE.Group();
      grp.name = name || 'stick';
      const woodMat = new THREE.MeshStandardMaterial({ color: 0xedd6af, roughness: 0.35, metalness: 0.05 });

      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.0048, 0.0070, 0.32, 10), woodMat);
      shaft.position.y = 0.16;
      grp.add(shaft);

      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.0062, 10, 10), woodMat);
      tip.position.y = 0.325;
      tip.scale.set(1.0, 1.4, 1.0);
      grp.add(tip);

      const buttShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.0070, 0.0072, 0.07, 10), woodMat);
      buttShaft.position.y = -0.035;
      grp.add(buttShaft);

      const buttCap = new THREE.Mesh(new THREE.SphereGeometry(0.0071, 8, 8), woodMat);
      buttCap.position.y = -0.07;
      grp.add(buttCap);

      const brandBand = new THREE.Mesh(new THREE.CylinderGeometry(0.00705, 0.00705, 0.012, 10), new THREE.MeshBasicMaterial({ color: 0x242424 }));
      brandBand.position.y = 0.025;
      grp.add(brandBand);

      return grp;
    }

    function applyFingerGrip(vrm, curled) {
      const h = vrm?.humanoid;
      if (!h) return;
      ['left', 'right'].forEach(side => {
        const s = (side === 'left') ? 1 : -1;
        ['Index', 'Middle', 'Ring', 'Little'].forEach((f) => {
          const prox = h.getNormalizedBoneNode(side + f + 'Proximal');
          const inter = h.getNormalizedBoneNode(side + f + 'Intermediate');
          const dist = h.getNormalizedBoneNode(side + f + 'Distal');
          if (prox) prox.rotation.set(0, 0, curled ? s * 1.25 : 0);
          if (inter) inter.rotation.set(0, 0, curled ? s * 1.35 : 0);
          if (dist) dist.rotation.set(0, 0, curled ? s * 0.85 : 0);
        });
        const tProx = h.getNormalizedBoneNode(side + 'ThumbProximal');
        const tDist = h.getNormalizedBoneNode(side + 'ThumbDistal');
        if (tProx) tProx.rotation.set(curled ? 0.3 : 0, curled ? s * 0.55 : 0, curled ? s * 0.45 : 0);
        if (tDist) tDist.rotation.set(curled ? 0.1 : 0, curled ? s * 0.35 : 0, curled ? s * 0.35 : 0);
      });
    }

    function attachDrumsticks(vrm) {
      if (stickL && stickL.parent) stickL.parent.remove(stickL);
      if (stickR && stickR.parent) stickR.parent.remove(stickR);

      const leftHand = vrm.humanoid?.getNormalizedBoneNode('leftHand');
      const rightHand = vrm.humanoid?.getNormalizedBoneNode('rightHand');

      if (leftHand) {
        stickL = createStick('stickL');
        stickL.position.set(-0.0562, -0.0080, -0.0015);
        stickL.rotation.set(-0.262, -1.518, 1.267);
        stickL.visible = isDrummingActive;
        leftHand.add(stickL);
      }
      if (rightHand) {
        stickR = createStick('stickR');
        stickR.position.set(0.0487, -0.0043, -0.0063);
        stickR.rotation.set(-1.597, -0.044, -0.262);
        stickR.visible = isDrummingActive;
        rightHand.add(stickR);
      }
    }

    // Reusable quaternions to keep GC zero-allocation during drumming loop!
    const _q0 = new THREE.Quaternion();
    const _q1 = new THREE.Quaternion();

    function sampleDrumTrack(track, t) {
      if (!track || track.length === 0) return null;
      if (track.length === 1) return track[0].q;
      if (t <= track[0].time) return track[0].q;
      if (t >= track[track.length - 1].time) return track[track.length - 1].q;

      let i0 = 0;
      for (let i = 0; i < track.length - 1; i++) {
        if (track[i].time <= t && t <= track[i + 1].time) {
          i0 = i;
          break;
        }
      }
      const k0 = track[i0];
      const k1 = track[i0 + 1];
      const alpha = (t - k0.time) / Math.max(0.0001, k1.time - k0.time);
      _q0.fromArray(k0.q);
      _q1.fromArray(k1.q);
      _q0.slerp(_q1, alpha);
      return _q0;
    }

    function applyDrummingFrame(vrm, t) {
      const h = vrm.humanoid;
      if (!h) return;

      // 1. Lock seated lower body smoothly at stage elevation
      for (const [bone, data] of Object.entries(seatedLowerBody)) {
        const node = h.getNormalizedBoneNode(bone);
        if (node) {
          if (data.pos) node.position.fromArray(data.pos);
          if (data.quat) node.quaternion.fromArray(data.quat);
        }
      }

      // 2. Apply slerped arm + chest keyframes from calibrated astra_drum_animation.json
      if (drumAnimData?.tracks) {
        for (const bName of drumBoneNames) {
          const node = h.getNormalizedBoneNode(bName);
          const track = drumAnimData.tracks[bName];
          if (node && track) {
            const res = sampleDrumTrack(track, t);
            if (res) {
              if (Array.isArray(res)) node.quaternion.fromArray(res);
              else node.quaternion.copy(res);
            }
          }
        }
      }
    }

    const speedMap = {
      idle: 0.85,
      idle_look: 0.85,
      neutral_idle: 0.82,
      standing_pose: 0.80,
      walk: 0.85,
      picked_up: 0.85,
      picked_up_alt: 0.85,
      sit: 0.75,
      lay: 0.85,
      wave: 0.95,
      celebrate: 0.90,
      talk: 0.85,
      dance_1: 0.88,
      dance_2: 0.88,
      hiphop: 0.88,
      twist_dance: 0.85,
      silly_dance: 0.85,
      breakdance: 0.92,
      samba: 0.90
    };

    const idleVariations = ['idle', 'idle_look', 'neutral_idle', 'standing_pose'];
    const danceNames = ['dance_1', 'dance_2', 'hiphop', 'twist_dance', 'silly_dance', 'breakdance', 'samba', 'celebrate'];

    const animConfig = {
      idle: 'animations/idle_loop.vrma',
      idle_look: 'animations/idle_look.vrma',
      neutral_idle: 'animations/neutral_idle.vrma',
      standing_pose: 'animations/female_standing.vrma',
      walk: 'animations/running.vrma',
      picked_up: 'animations/hanging.vrma',
      picked_up_alt: 'animations/hang.vrma',
      sit: 'animations/sit.vrma',
      lay: 'animations/lay.vrma',
      wave: 'animations/wave_fast.vrma',
      celebrate: 'animations/joyful_jump.vrma',
      talk: 'animations/talking.vrma',
      dance_1: 'animations/dance_1.vrma',
      dance_2: 'animations/dance_2.vrma',
      hiphop: 'animations/hiphop.vrma',
      twist_dance: 'animations/twist_dance.vrma',
      silly_dance: 'animations/silly_dance.vrma',
      breakdance: 'animations/breakdance.vrma',
      samba: 'animations/samba.vrma'
    };

    const lookAtTarget = new THREE.Object3D();
    lookAtTarget.position.set(0, 1.35, 10.0);
    scene.add(lookAtTarget);

    const desiredLookAt = new THREE.Vector3(0, 1.35, 10.0);
    let lastMouseMoveTime = Date.now();

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

    function sanitizeClip(clip, vrm, animKey) {
      const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
      const restY = hips ? hips.position.y : 0.893;
      clip.tracks.forEach(track => {
        if (track.name.endsWith('.position')) {
          const vals = track.values;
          const count = vals.length / 3;
          if (count === 0) return;
          let sumX = 0, sumY = 0, sumZ = 0;
          for (let i = 0; i < count; i++) {
            sumX += vals[i * 3];
            sumY += vals[i * 3 + 1];
            sumZ += vals[i * 3 + 2];
          }
          const avgX = sumX / count, avgY = sumY / count, avgZ = sumZ / count;
          const isSit = animKey === 'sit';
          const isLay = animKey === 'lay';
          let targetY = isLay ? restY * 0.18 : (isSit ? restY * 0.62 : restY);
          for (let i = 0; i < count; i++) {
            vals[i * 3 + 0] = (vals[i * 3 + 0] - avgX) * 0.45;
            const newY = targetY + (vals[i * 3 + 1] - avgY);
            vals[i * 3 + 1] = Math.max(0.28, Math.min(1.4, newY));
            vals[i * 3 + 2] = (vals[i * 3 + 2] - avgZ) * 0.35;
          }
        }
      });
      return clip;
    }

    // Lazy on-demand VRMA loader (saves ~250MB RAM and eliminates startup stutters!)
    async function ensureActionLoaded(key, vrm) {
      if (actions[key]) return actions[key];
      if (!vrm || !animConfig[key]) return null;
      if (loadingAnims[key]) return loadingAnims[key];

      loadingAnims[key] = (async () => {
        try {
          let vrma = cachedVRMAs[key];
          if (!vrma) {
            const animGltf = await loader.loadAsync(animConfig[key]);
            vrma = animGltf.userData.vrmAnimations?.[0];
            if (vrma) cachedVRMAs[key] = vrma;
          }
          if (vrma && currentVRM === vrm && mixer) {
            const rawClip = createVRMAnimationClip(vrma, vrm);
            const sanitizedClip = sanitizeClip(rawClip, vrm, key);
            const action = mixer.clipAction(sanitizedClip);
            if (key === 'wave' || key === 'celebrate') {
              action.setLoop(THREE.LoopOnce);
              action.clampWhenFinished = true;
            } else {
              action.setLoop(THREE.LoopRepeat);
            }
            const naturalSpeed = speedMap[key] || 0.90;
            action.timeScale = naturalSpeed;
            actions[key] = action;
            return action;
          }
        } catch (e) {
          console.warn('[AstraVRM] Lazy load anim error:', key, e);
        } finally {
          delete loadingAnims[key];
        }
        return null;
      })();

      return loadingAnims[key];
    }

    async function init() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const initialModel = urlParams.get('model') || 'Sendagaya_Shino_opt.vrm';
        const gltf = await loader.loadAsync(initialModel);
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);
        currentVRM = vrm;
        window.currentVRM = vrm;

        vrm.scene.rotation.y = Math.PI;
        attachDrumsticks(vrm);

        if (vrm.lookAt) vrm.lookAt.target = lookAtTarget;

        mixer = new THREE.AnimationMixer(vrm.scene);
        window.mixer = mixer;
        window.actions = actions;
        window.ensureActionLoaded = ensureActionLoaded;

        // Only load lightweight idle animation upfront!
        await ensureActionLoaded('idle', vrm);
        playAction('idle', 0.20);
        window.isPetReady = true;
        console.log('[AstraVRM] Lightweight pet ready!');

        // Pre-warm core interactive animations sequentially in background (zero stutter on first fall/walk!)
        setTimeout(async () => {
          const warmKeys = ['walk', 'sit', 'picked_up', 'wave', 'celebrate', 'idle_look', 'neutral_idle'];
          for (const k of warmKeys) {
            try { await ensureActionLoaded(k, vrm); } catch (e) {}
          }
          console.log('[AstraVRM] Pre-warmed core animations:', Object.keys(actions));
        }, 80);
      } catch (err) {
        console.error('[AstraVRM] Initialization error:', err);
      }
    }

    window.switchVRMModel = async function(modelFileName) {
      try {
        if (!modelFileName) return;
        if (currentVRM) {
          scene.remove(currentVRM.scene);
          VRMUtils.deepDispose(currentVRM.scene);
          currentVRM = null;
        }
        const gltf = await loader.loadAsync(modelFileName);
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);
        currentVRM = vrm;
        window.currentVRM = vrm;
        vrm.scene.rotation.y = targetRotationY;
        if (vrm.lookAt) vrm.lookAt.target = lookAtTarget;

        mixer = new THREE.AnimationMixer(vrm.scene);
        window.mixer = mixer;
        for (const k in actions) delete actions[k];

        await ensureActionLoaded('idle', vrm);
        attachDrumsticks(vrm);
        currentAction = null;
        window.setPetState(currentState || 'idle');
      } catch (err) {
        console.error('[AstraVRM] Model switch error:', err);
      }
    };

    async function playAction(name, fadeDuration = 0.30) {
      if (!mixer || !currentVRM) return;
      const vrmRef = currentVRM;
      let nextAction = actions[name];
      if (!nextAction) {
        nextAction = await ensureActionLoaded(name, vrmRef);
      }
      if (!nextAction || currentVRM !== vrmRef) return;
      if (isDrummingActive) return; // Don't clobber drumming mode if async fetch finished late!
      if (currentAction === nextAction && nextAction.isRunning()) return;

      nextAction.reset();
      const naturalSpeed = speedMap[name] || 0.90;
      nextAction.timeScale = naturalSpeed;
      nextAction.setEffectiveTimeScale(naturalSpeed);
      nextAction.setEffectiveWeight(1.0);

      if (currentAction) {
        currentAction.crossFadeTo(nextAction, fadeDuration, true);
      }
      nextAction.play();
      currentAction = nextAction;
    }

    init();

    function setExpressionSafe(name, val) {
      if (!currentVRM?.expressionManager) return;
      const em = currentVRM.expressionManager;
      if (em.expressionMap && em.expressionMap[name] !== undefined) {
        em.setValue(name, val);
        return;
      }
      const lower = String(name).toLowerCase();
      if (em.expressionMap) {
        for (const k in em.expressionMap) {
          if (k.toLowerCase() === lower) {
            em.setValue(k, val);
            return;
          }
        }
      }
      try { em.setValue(name, val); } catch (e) {}
    }

    // 5. Global API exposed to Python PyQt6
    window.setPetState = (state, facingDirection) => {
      currentState = state || 'idle';
      ['happy', 'relaxed', 'surprised', 'sad', 'angry'].forEach(e => {
        setExpressionSafe(e, 0);
      });

      if (facingDirection !== undefined) {
        if (facingDirection < 0) targetRotationY = Math.PI - 0.35;
        else if (facingDirection > 0) targetRotationY = Math.PI + 0.35;
        else targetRotationY = Math.PI;
      } else {
        targetRotationY = Math.PI;
      }

      const wantDrumming = (currentState === 'dance' || currentState === 'drums' || currentState === 'drumming');
      isDrummingActive = wantDrumming;
      drumStageGroup.visible = wantDrumming;
      if (stickL) stickL.visible = wantDrumming;
      if (stickR) stickR.visible = wantDrumming;

      if (wantDrumming) {
        ensureDrumAssetsLoaded();
        if (currentAction) {
          currentAction.stop();
          currentAction = null;
        }
        applyFingerGrip(currentVRM, true);
        setExpressionSafe('happy', 0.95);
        setExpressionSafe('relaxed', 0.2);
        targetRotationY = Math.PI;
        drumTime = 0;
        if (currentVRM) applyDrummingFrame(currentVRM, 0);
        return;
      } else {
        applyFingerGrip(currentVRM, false);
      }

      if (currentState === 'picked_up') {
        setExpressionSafe('surprised', 1.0);
        const pickKey = (Math.random() < 0.4 && actions['picked_up_alt']) ? 'picked_up_alt' : 'picked_up';
        playAction(pickKey, 0.35);
        // Lazy-cache alternate hang pose cleanly for next pickup
        if (!actions['picked_up_alt'] && currentVRM) ensureActionLoaded('picked_up_alt', currentVRM).catch(() => {});
      } else if (currentState === 'sit') {
        setExpressionSafe('relaxed', 1.0);
        playAction('sit', 0.50);
      } else if (currentState === 'lay') {
        setExpressionSafe('relaxed', 0.95);
        setExpressionSafe('happy', 0.20);
        playAction('lay', 0.55);
      } else if (currentState === 'walk') {
        setExpressionSafe('relaxed', 0.3);
        playAction('walk', 0.35);
      } else if (currentState === 'wave') {
        setExpressionSafe('happy', 1.0);
        playAction('wave', 0.30);
      } else if (currentState === 'celebrate') {
        setExpressionSafe('happy', 1.0);
        playAction('celebrate', 0.30);
      } else {
        setExpressionSafe('relaxed', 0.35);
        setExpressionSafe('happy', 0.15);
        playAction('idle', 0.45);
      }
    };

    window.setFacing = (facing) => {
      if (isDrummingActive) { targetRotationY = Math.PI; return; }
      if (facing < 0) targetRotationY = Math.PI - 0.35;
      else if (facing > 0) targetRotationY = Math.PI + 0.35;
      else targetRotationY = Math.PI;
    };

    let targetSpeechLevel = 0.0;
    let smoothedSpeechLevel = 0.0;
    let hasLiveSpeechEnvelope = false;
    let drumSpeedScale = 1.0;
    let targetDrumSpeedScale = 1.0;
    let drumKickBounce = 0.0;

    window.setSpeechLevel = (lvl) => {
      targetSpeechLevel = Math.max(0.0, Math.min(1.0, Number(lvl) || 0.0));
      hasLiveSpeechEnvelope = true;
    };

    window.setEmotion = (emotion) => {
      ['happy', 'relaxed', 'surprised', 'sad', 'angry'].forEach(e => setExpressionSafe(e, 0));
      if (emotion === 'happy' || emotion === 'star' || emotion === 'celebrate') {
        setExpressionSafe('happy', 0.9);
      } else if (emotion === 'surprised' || emotion === 'shock') {
        setExpressionSafe('surprised', 0.85);
      } else if (emotion === 'sad' || emotion === 'dizzy') {
        setExpressionSafe('sad', 0.75);
      } else if (emotion === 'angry') {
        setExpressionSafe('angry', 0.75);
      } else if (emotion === 'thinking' || emotion === 'relaxed') {
        setExpressionSafe('relaxed', 0.8);
      }
    };

    window.setBeatPulse = (peak, speedScale, beatHit) => {
      const p = Math.max(0.0, Math.min(1.0, Number(peak) || 0.0));
      const s = Math.max(0.72, Math.min(1.45, Number(speedScale) || 1.0));
      targetDrumSpeedScale = s;
      if (p > 0.10) {
        drumKickBounce = Math.max(drumKickBounce, Math.min(0.055, p * 0.055));
      }
      // True PLL Phase Locking: when a real audio beat hits, smoothly nudge
      // the drumming timeline phase toward the nearest strike point (quarter beat = 0.40s)
      if (beatHit) {
        const beatInterval = drumDuration / 4.0;
        const nearestBeat = Math.round(drumTime / beatInterval) * beatInterval;
        const phaseError = nearestBeat - drumTime;
        drumTime += phaseError * 0.45;
      }
    };

    window.setTalking = (talking) => {
      isTalking = Boolean(talking);
      if (isTalking) {
        if (!isDrummingActive && (currentState === 'idle' || currentState === 'sit')) {
          playAction('talk', 0.25);
        }
      } else {
        targetSpeechLevel = 0.0;
        smoothedSpeechLevel = 0.0;
        hasLiveSpeechEnvelope = false;
        if (currentVRM?.expressionManager) {
          currentVRM.expressionManager.setValue('aa', 0);
          currentVRM.expressionManager.setValue('oh', 0);
          currentVRM.expressionManager.setValue('ih', 0);
        }
        if (!isDrummingActive && currentState === 'idle') {
          playAction('idle', 0.3);
        }
      }
    };

    window.setLookAt = (screenNormX, screenNormY) => {
      lastMouseMoveTime = Date.now();
      desiredLookAt.x = screenNormX * 2.2;
      desiredLookAt.y = 1.35 - screenNormY * 1.8;
    };

    // Dynamic Window Inertia (Velocity Tracking for Body Lean & SpringBone Wind)
    let smoothedVx = 0.0;
    let smoothedVy = 0.0;
    let targetBodyRoll = 0.0;
    let targetBodyPitch = 0.0;

    window.setMotionVelocity = (vx, vy) => {
      const vX = Number(vx) || 0.0;
      const vY = Number(vy) || 0.0;
      smoothedVx += (vX - smoothedVx) * 0.35;
      smoothedVy += (vY - smoothedVy) * 0.35;
    };

    window.getMotionVelocity = () => ({
      vx: smoothedVx,
      vy: smoothedVy,
      roll: targetBodyRoll,
      pitch: targetBodyPitch
    });

    // Multi-Bone Natural LookAt Kinematics, Saccades & Petting Interaction
    let curHeadYaw = 0.0;
    let curHeadPitch = 0.0;
    let saccadeTimer = 2.5;
    const saccadeOffset = new THREE.Vector2(0, 0);
    let isPettingActive = false;
    let pettingTimer = 0.0;

    window.triggerHeadPet = (durationMs) => {
      isPettingActive = true;
      pettingTimer = Math.max(1.2, (Number(durationMs) || 2200) / 1000.0);
      setExpressionSafe('happy', 1.0);
      setExpressionSafe('relaxed', 0.85);
    };

    window.nextDance = () => {
      isDrummingActive = false;
      drumStageGroup.visible = false;
      if (stickL) stickL.visible = false;
      if (stickR) stickR.visible = false;
      applyFingerGrip(currentVRM, false);
      currentDanceIndex++;
      const chosen = danceNames[currentDanceIndex % danceNames.length];
      playAction(chosen, 0.35);
      return chosen;
    };
    window.cycleDance = window.nextDance;

    window.triggerWave = () => window.setPetState('wave');
    window.triggerJump = () => window.setPetState('celebrate');

    let lastMouseEventTs = 0;
    window.addEventListener('mousemove', (e) => {
      const now = performance.now();
      if (now - lastMouseEventTs < 80) return;
      lastMouseEventTs = now;
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = (e.clientY / window.innerHeight) * 2 - 1;
      window.setLookAt(normX, normY);
    });

    // Expose idle variation selector & eco FPS control
    let ecoMode = true; // Auto-adaptive: 60 FPS active, exact VSYNC-locked 30 FPS calm idle (-50% GPU/CPU)
    let isRenderPaused = false;
    let ecoFrameParity = 0;
    let idleVarTimer = 11.0;
    let idleVarIndex = 0;

    window.setEcoMode = (enabled) => { ecoMode = Boolean(enabled); };
    window.getEcoMode = () => ecoMode;
    window.setRenderPaused = (paused) => { isRenderPaused = Boolean(paused); };
    window.playIdleVariation = (idx) => {
      if (isDrummingActive || currentState !== 'idle') return null;
      const key = idleVariations[(idx ?? (++idleVarIndex)) % idleVariations.length];
      playAction(key, 0.55);
      return key;
    };

    // 6. Adaptive VSYNC-locked Render Loop (60 FPS Active / Clean Locked 30 FPS Idle — Zero Cadence Judder!)
    const clock = new THREE.Clock();
    let elapsedTotal = 0;
    let blinkTimer = 2.0;
    let isBlinking = false;
    let blinkProgress = 0;
    const _curLookTarget = new THREE.Vector3().copy(camStandLook);

    function animate() {
      requestAnimationFrame(animate);
      if (isRenderPaused) return;

      const targetCamPos = isDrummingActive ? camDrumPos : camStandPos;
      const targetCamLook = isDrummingActive ? camDrumLook : camStandLook;
      const camMoving = camera.position.distanceToSquared(targetCamPos) > 0.0004;
      const rotMoving = currentVRM && Math.abs(targetRotationY - currentVRM.scene.rotation.y) > 0.005;
      const mouseActive = (Date.now() - lastMouseMoveTime) < 1200;
      const velMoving = (Math.abs(smoothedVx) > 0.05 || Math.abs(smoothedVy) > 0.05);
      const isActive = isDrummingActive || isTalking || isBlinking || camMoving || rotMoving || mouseActive || velMoving || isPettingActive || (currentState !== 'idle' && currentState !== 'sit' && currentState !== 'lay');

      // Skip strictly every 2nd VSYNC tick (exact 30.0 FPS flat!) in calm idle when Eco Mode is active
      if (ecoMode && !isActive) {
        ecoFrameParity = (ecoFrameParity + 1) & 1;
        if (ecoFrameParity === 1) return;
      }

      // Real-time delta clamped cleanly for smooth frame progression
      const delta = Math.min(clock.getDelta(), 0.06);
      if (delta <= 0) return;
      animateCore(delta);
    }

    function animateCore(delta) {
      elapsedTotal += delta;

      const targetCamPos = isDrummingActive ? camDrumPos : camStandPos;
      const targetCamLook = isDrummingActive ? camDrumLook : camStandLook;
      const camMoving = camera.position.distanceToSquared(targetCamPos) > 0.0004;
      const rotMoving = currentVRM && Math.abs(targetRotationY - currentVRM.scene.rotation.y) > 0.005;

      // Smoothly interpolate camera framing between standing and seated drumming
      if (camMoving) {
        camera.position.lerp(targetCamPos, 0.14);
        _curLookTarget.lerp(targetCamLook, 0.14);
        camera.lookAt(_curLookTarget);
      }

      if (currentVRM) {
        if (isDrummingActive) {
          drumSpeedScale += (targetDrumSpeedScale - drumSpeedScale) * 0.18;
          drumTime = (drumTime + delta * drumSpeedScale) % drumDuration;
          applyDrummingFrame(currentVRM, drumTime);
          if (drumKickBounce > 0.0005) {
            drumKickBounce *= 0.82;
            const sc = 1.0 + drumKickBounce;
            drumStageGroup.scale.set(sc, sc, sc);
          } else if (drumStageGroup.scale.x !== 1.0) {
            drumStageGroup.scale.set(1.0, 1.0, 1.0);
          }
        } else {
          if (drumStageGroup.scale.x !== 1.0) drumStageGroup.scale.set(1.0, 1.0, 1.0);
          if (currentState === 'idle' && !isTalking && !isPettingActive) {
            idleVarTimer -= delta;
            if (idleVarTimer <= 0) {
              idleVarTimer = 10.0 + Math.random() * 6.0;
              window.playIdleVariation();
            }
          }
          if (mixer) mixer.update(delta);

          // 1. Dynamic Window Velocity Inertia: Body Roll & Pitch
          smoothedVx *= 0.92;
          smoothedVy *= 0.92;
          targetBodyRoll = -THREE.MathUtils.clamp(smoothedVx * 0.0055, -0.22, 0.22);
          targetBodyPitch = THREE.MathUtils.clamp(smoothedVy * 0.0055, -0.18, 0.18);

          if (currentState !== 'lay') {
            currentVRM.scene.rotation.z += (targetBodyRoll - currentVRM.scene.rotation.z) * 0.16;
            currentVRM.scene.rotation.x += (targetBodyPitch - currentVRM.scene.rotation.x) * 0.16;
          } else {
            currentVRM.scene.rotation.z += (0.0 - currentVRM.scene.rotation.z) * 0.16;
            currentVRM.scene.rotation.x += (0.0 - currentVRM.scene.rotation.x) * 0.16;
          }

          // 2. SpringBone Dynamic Wind / Inertia Response
          if (currentVRM.springBoneManager) {
            const windX = -smoothedVx * 0.015;
            const windY = -smoothedVy * 0.012;
            const speedMag = Math.hypot(windX, windY);
            const gravDirX = THREE.MathUtils.clamp(windX, -0.75, 0.75);
            const gravDirY = THREE.MathUtils.clamp(-1.0 + windY, -1.8, -0.3);
            currentVRM.springBoneManager.joints.forEach(joint => {
              if (joint.settings) {
                joint.settings.gravityDir.set(gravDirX, gravDirY, 0).normalize();
                joint.settings.gravityPower = 1.0 + Math.min(3.5, speedMag * 2.8);
              }
            });
          }

          // 3. Multi-Bone Natural LookAt Kinematic Chain & Natural Saccades
          saccadeTimer -= delta;
          if (saccadeTimer <= 0) {
            saccadeTimer = 2.0 + Math.random() * 3.0;
            saccadeOffset.set((Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.05);
          } else {
            saccadeOffset.multiplyScalar(0.92);
          }

          if (isPettingActive) {
            pettingTimer -= delta;
            if (pettingTimer <= 0) {
              isPettingActive = false;
              if (currentState === 'idle') {
                setExpressionSafe('happy', 0.20);
                setExpressionSafe('relaxed', 0.35);
              }
            }
          }

          const dx = lookAtTarget.position.x - 0.0;
          const dy = lookAtTarget.position.y - 1.30;
          const dz = lookAtTarget.position.z - 0.0;
          const rawYaw = Math.atan2(dx, dz);
          const rawPitch = -Math.atan2(dy, Math.hypot(dx, dz));
          const facingRelYaw = rawYaw - (targetRotationY - Math.PI);
          const clampedYaw = THREE.MathUtils.clamp(facingRelYaw, -0.72, 0.72);
          const clampedPitch = THREE.MathUtils.clamp(rawPitch, -0.38, 0.32);
          curHeadYaw += (clampedYaw + saccadeOffset.x - curHeadYaw) * 0.12;
          curHeadPitch += (clampedPitch + saccadeOffset.y - curHeadPitch) * 0.12;

          if (currentState !== 'lay') {
            const neck = currentVRM.humanoid?.getNormalizedBoneNode('neck');
            const head = currentVRM.humanoid?.getNormalizedBoneNode('head');
            const upperChest = currentVRM.humanoid?.getNormalizedBoneNode('upperChest');
            if (neck) {
              neck.rotation.y += curHeadYaw * 0.22;
              neck.rotation.x += curHeadPitch * 0.18;
            }
            if (head) {
              head.rotation.y += curHeadYaw * 0.65;
              head.rotation.x += curHeadPitch * 0.65;
              if (isPettingActive) {
                head.rotation.z += 0.14; // soft lean into petting hand
              }
            }
            if (upperChest) {
              upperChest.rotation.y += curHeadYaw * 0.13;
              upperChest.rotation.x += curHeadPitch * 0.15;
            }
          }

          // 4. Procedural Secondary Dynamics: Organic Breathing
          const breath = Math.sin(elapsedTotal * 1.57);
          const chestNode = currentVRM.humanoid?.getNormalizedBoneNode('chest');
          const spineNode = currentVRM.humanoid?.getNormalizedBoneNode('spine');
          if (chestNode) {
            chestNode.scale.set(1.0 + breath * 0.015, 1.0 + breath * 0.022, 1.0 + breath * 0.015);
          }
          if (spineNode && currentState !== 'lay') {
            spineNode.rotation.x += breath * 0.010;
          }

          // 5. Procedural Idle Fidgeting / Weight Shifting
          if (currentState === 'idle' && !isTalking && !isPettingActive) {
            const shift = Math.sin(elapsedTotal * 0.28);
            const hips = currentVRM.humanoid?.getNormalizedBoneNode('hips');
            if (hips) {
              hips.position.x += shift * 0.014;
              hips.rotation.z += shift * 0.012;
            }
          }

          // 6. Playful Sitting Leg Swings
          if (currentState === 'sit') {
            const leftLL = currentVRM.humanoid?.getNormalizedBoneNode('leftLowerLeg');
            const rightLL = currentVRM.humanoid?.getNormalizedBoneNode('rightLowerLeg');
            if (leftLL) leftLL.rotation.x += Math.sin(elapsedTotal * 1.6) * 0.12;
            if (rightLL) rightLL.rotation.x += Math.sin(elapsedTotal * 1.6 + 0.8) * 0.10;
          }

          // 7. Picked Up / Grabbed Dangling Dynamics
          if (currentState === 'picked_up') {
            const dangle = Math.sin(elapsedTotal * 3.2);
            const leftUL = currentVRM.humanoid?.getNormalizedBoneNode('leftUpperLeg');
            const rightUL = currentVRM.humanoid?.getNormalizedBoneNode('rightUpperLeg');
            const leftLL = currentVRM.humanoid?.getNormalizedBoneNode('leftLowerLeg');
            const rightLL = currentVRM.humanoid?.getNormalizedBoneNode('rightLowerLeg');
            if (leftUL) leftUL.rotation.z += dangle * 0.15 + (smoothedVx * 0.005);
            if (rightUL) rightUL.rotation.z -= dangle * 0.15 - (smoothedVx * 0.005);
            if (leftLL) leftLL.rotation.x += Math.abs(dangle) * 0.18;
            if (rightLL) rightLL.rotation.x += Math.abs(Math.cos(elapsedTotal * 3.2)) * 0.18;
          }
        }

        currentVRM.update(delta);

        // Hips safety guard against runaway NaN or sinking below floor
        if (!isDrummingActive) {
          const hips = currentVRM.humanoid?.getNormalizedBoneNode('hips');
          if (hips) {
            if (isNaN(hips.position.y) || hips.position.y < 0.10) hips.position.y = 0.893;
            if (Math.abs(hips.position.x) > 0.65) hips.position.x = Math.sign(hips.position.x) * 0.65;
            if (Math.abs(hips.position.z) > 0.65) hips.position.z = Math.sign(hips.position.z) * 0.65;
          }
        }

        if (rotMoving) {
          currentVRM.scene.rotation.y += (targetRotationY - currentVRM.scene.rotation.y) * 0.15;
        }

        const mouseActive = (Date.now() - lastMouseMoveTime) < 1200;
        if (!mouseActive && (Date.now() - lastMouseMoveTime > 2500)) {
          desiredLookAt.set(Math.sin(elapsedTotal * 0.45) * 0.6, 1.35 + Math.cos(elapsedTotal * 0.3) * 0.2, 10.0);
        }
        lookAtTarget.position.lerp(desiredLookAt, 0.10);

        if (!isDrummingActive) {
          blinkTimer -= delta;
          if (blinkTimer <= 0) {
            isBlinking = true;
            blinkProgress = 0;
            blinkTimer = (Math.random() < 0.22) ? 0.32 : (2.5 + Math.random() * 3.0);
          }
          if (isBlinking) {
            blinkProgress += delta * 12.0;
            if (blinkProgress < Math.PI) {
              currentVRM.expressionManager?.setValue('blink', Math.sin(blinkProgress));
            } else {
              currentVRM.expressionManager?.setValue('blink', 0.0);
              isBlinking = false;
            }
          }
        }

        if (isTalking) {
          talkTimer += delta * 12.0;
          if (hasLiveSpeechEnvelope) {
            smoothedSpeechLevel += (targetSpeechLevel - smoothedSpeechLevel) * 0.50;
            const lvl = smoothedSpeechLevel;
            currentVRM.expressionManager?.setValue('aa', Math.min(0.90, lvl * 0.85));
            currentVRM.expressionManager?.setValue('oh', Math.max(0, lvl - 0.25) * 0.55);
            currentVRM.expressionManager?.setValue('ih', lvl * (0.20 + 0.15 * Math.abs(Math.sin(talkTimer))));
          } else {
            currentVRM.expressionManager?.setValue('aa', Math.max(0, Math.sin(talkTimer)) * 0.65);
            currentVRM.expressionManager?.setValue('oh', Math.max(0, Math.cos(talkTimer * 0.75)) * 0.45);
            currentVRM.expressionManager?.setValue('ih', Math.max(0, Math.sin(talkTimer * 1.3)) * 0.35);
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.stepFrame = (dt = 0.033) => {
      animateCore(dt);
    };

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      updateDrumCameraFraming();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
