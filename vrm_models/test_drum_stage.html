<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script async src="./lib/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three.module.js",
        "three/addons/": "./lib/",
        "@pixiv/three-vrm": "./lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "./lib/three-vrm-animation.module.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #1a1a24; overflow: hidden; font-family: sans-serif; color: #fff; }
    #container { width: 100vw; height: 100vh; position: absolute; left: 0; top: 0; }
    #controls {
      position: absolute; bottom: 12px; left: 12px; z-index: 100;
      background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(8px);
      padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px; display: flex; gap: 12px; align-items: center;
    }
    button {
      background: #4f46e5; color: white; border: none; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #6366f1; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="controls">
    <button id="togglePlay">Pause</button>
    <button id="viewFront">Front</button>
    <button id="viewHands">Hands Close-up</button>
    <button id="viewSide">Side View</button>
    <span id="timeDisplay">0.00s</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';
    import { loadMixamoAnimation } from './loadMixamoAnimation.js';

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    window.scene = scene;

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20);
    window.camera = camera;
    camera.position.set(0, 1.15, 2.3);
    camera.lookAt(0, 0.55, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    window.renderer = renderer;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(1.5, 3, 2.5);
    scene.add(keyLight);
    
    const fillLight = new THREE.DirectionalLight(0x88bbff, 1.3);
    fillLight.position.set(-2, 1.5, 1);
    scene.add(fillLight);
    
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    window.isReady = false;

    // Load Drum Kit
    const gltfLoader = new GLTFLoader();
    let drumKit = null;
    gltfLoader.load('drum_kit.glb', (gltf) => {
      drumKit = gltf.scene;
      window.drumKit = drumKit;
      drumKit.scale.set(0.68, 0.68, 0.68);
      drumKit.position.set(0, 0.40, 0.48);
      drumKit.rotation.y = 0;
      scene.add(drumKit);
    });

    // Create Drum Stool (Seat)
    const seatGroup = new THREE.Group();
    const cushion = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 0.08, 24),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 })
    );
    cushion.position.y = 0.45;
    seatGroup.add(cushion);
    const legMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.45, 16), legMat);
    stem.position.y = 0.225;
    seatGroup.add(stem);
    seatGroup.position.set(0, 0, -0.05);
    scene.add(seatGroup);

    // Authentic 5A Hickory Drumstick factory
    function createStick(name) {
      const grp = new THREE.Group();
      grp.name = name || 'stick';
      const woodMat = new THREE.MeshStandardMaterial({
        color: 0xedd6af,
        roughness: 0.35,
        metalness: 0.05
      });
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.0048, 0.0070, 0.32, 16),
        woodMat
      );
      shaft.position.y = 0.16;
      grp.add(shaft);

      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.0062, 16, 16),
        woodMat
      );
      tip.position.y = 0.325;
      tip.scale.set(1.0, 1.4, 1.0);
      grp.add(tip);

      const buttShaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.0070, 0.0072, 0.07, 16),
        woodMat
      );
      buttShaft.position.y = -0.035;
      grp.add(buttShaft);

      const buttCap = new THREE.Mesh(
        new THREE.SphereGeometry(0.0071, 14, 14),
        woodMat
      );
      buttCap.position.y = -0.07;
      grp.add(buttCap);

      const brandBand = new THREE.Mesh(
        new THREE.CylinderGeometry(0.00705, 0.00705, 0.012, 16),
        new THREE.MeshBasicMaterial({ color: 0x242424 })
      );
      brandBand.position.y = 0.025;
      grp.add(brandBand);
      return grp;
    }
    window.createStick = createStick;

    const vrmLoader = new GLTFLoader();
    vrmLoader.register(parser => new VRMLoaderPlugin(parser));

    vrmLoader.load('Sendagaya_Shino.vrm', async (gltf) => {
      const vrm = gltf.userData.vrm;
      window.vrm = vrm;
      scene.add(vrm.scene);
      vrm.scene.rotation.y = Math.PI; // Face forward towards camera

      // Attach drumsticks to hands
      const leftHand = vrm.humanoid.getNormalizedBoneNode('leftHand');
      const rightHand = vrm.humanoid.getNormalizedBoneNode('rightHand');
      
      const stickL = createStick('stickL');
      window.stickL = stickL;
      // User-calibrated matched grip (Astra 3D Studio):
      stickL.position.set(-0.0562, -0.0080, -0.0015);
      stickL.rotation.set(-0.262, -1.518, 1.267);
      if (leftHand) leftHand.add(stickL);

      const stickR = createStick('stickR');
      window.stickR = stickR;
      // User-calibrated matched grip (Astra 3D Studio):
      stickR.position.set(0.0487, -0.0043, -0.0063);
      stickR.rotation.set(-1.597, -0.044, -0.262);
      if (rightHand) rightHand.add(stickR);

      window.setStickL = (px, py, pz, rx, ry, rz) => {
        stickL.position.set(px, py, pz);
        stickL.rotation.set(rx, ry, rz);
      };
      window.setStickR = (px, py, pz, rx, ry, rz) => {
        stickR.position.set(px, py, pz);
        stickR.rotation.set(rx, ry, rz);
      };
      window.getStickParams = () => ({
        L: { pos: stickL.position.toArray(), rot: stickL.rotation.toArray() },
        R: { pos: stickR.position.toArray(), rot: stickR.rotation.toArray() }
      });
      const clip = await loadMixamoAnimation('animations/Playing_Drums.fbx', vrm);
      const mixer = new THREE.AnimationMixer(vrm.scene);
      window.mixer = mixer;
      const action = mixer.clipAction(clip);
      window.action = action;
      action.play();

      window.isReady = true;

      // Controls setup
      const toggleBtn = document.getElementById('togglePlay');
      toggleBtn.onclick = () => {
        action.paused = !action.paused;
        toggleBtn.textContent = action.paused ? 'Play' : 'Pause';
      };

      document.getElementById('viewFront').onclick = () => {
        camera.position.set(0, 1.15, 2.3);
        camera.lookAt(0, 0.55, 0);
      };

      document.getElementById('viewHands').onclick = () => {
        camera.position.set(0, 0.85, 1.05);
        camera.lookAt(0, 0.65, 0);
      };

      document.getElementById('viewSide').onclick = () => {
        camera.position.set(1.4, 0.95, 1.1);
        camera.lookAt(0, 0.65, 0);
      };

      const timeDisplay = document.getElementById('timeDisplay');
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        mixer.update(delta);
        vrm.update(delta);
        if (action) {
          timeDisplay.textContent = action.time.toFixed(2) + 's';
        }
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
